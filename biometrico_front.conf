server {
    listen 82 ssl;
    server_name edomex-dtic.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/edomex-dtic.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edomex-dtic.duckdns.org/privkey.pem;

    location / {
        # Apunta al servidor de desarrollo de Vue 3 (Vite) en el 5175
        proxy_pass http://127.0.0.1:5175;

        # --- WEBSOCKETS (Hot Module Replacement de Vite) ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # ---------------------------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
